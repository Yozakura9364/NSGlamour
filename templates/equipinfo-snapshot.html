<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>装备信息 - 幻化工房</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/WebIcon.svg', v='20260629-1') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v='20260729-1') }}">
    <style>
      .snapshot-page {
        min-height: 100%;
      }

      .snapshot-main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 24px;
      }

      .snapshot-card {
        width: min(860px, 100%);
        margin: auto;
        padding: 16px 20px 20px;
        flex: 0 0 auto;
      }

      .snapshot-toolbar {
        display: flex;
        justify-content: flex-end;
        min-height: 30px;
        margin-bottom: 4px;
      }

      .snapshot-toolbar .language-controls:empty {
        display: none;
      }

      .snapshot-card .status-line {
        text-align: center;
      }

      @media (max-width: 720px) {
        .snapshot-main {
          padding: 10px;
        }

        .snapshot-card {
          width: 100%;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body class="snapshot-page">
    <main class="snapshot-main">
      <section class="result-section snapshot-card">
        <div class="snapshot-toolbar">
          <div id="snapshotLanguageControls" class="language-controls" aria-label="装备名语言"></div>
        </div>
        <p id="snapshotStatus" class="status-line">正在读取</p>
        <div id="snapshotSlotGrid" class="card-editor equipinfo-card-editor"></div>
      </section>
    </main>

    <script>
      window.NSGLAMOUR_SNAPSHOT_ID = {{ snapshot_id | tojson }};
    </script>
    <script src="{{ url_for('static', filename='common.js', v='20260630-1') }}"></script>
    <script src="{{ url_for('static', filename='snapshot.js', v='20260730-1') }}"></script>
  </body>
</html>
